<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Básicos ── -->
    <title>Joaquín González (J10) | Piloto de motocross</title>
    <meta
      name="description"
      content="Web oficial de Joaquín González, piloto de motocross. Conoce su moto, la galería, el calendario de carreras y los patrocinadores. Aquí no se frena: se acelera."
    />
    <link rel="canonical" href="https://joaquingonzalez10.netlify.app/" />
    <meta name="author" content="Joaquín González" />

    <!-- ── Iconos ── (ponlos en /public) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- <link rel="manifest" href="/site.webmanifest" /> -->

    <!-- ── Open Graph (WhatsApp, Facebook, LinkedIn...) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Joaquín González · J10" />
    <meta property="og:title" content="Joaquín González (J10) | Piloto de motocross" />
    <meta
      property="og:description"
      content="Carreras, moto, galería y patrocinadores de Joaquín González. Aquí no se frena: se acelera."
    />
    <meta property="og:url" content="https://joaquingonzalez10.netlify.app/" />
    <meta property="og:image" content="https://joaquingonzalez10.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joaquín González saltando con su moto de motocross" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joaquín González (J10) | Piloto de motocross" />
    <meta
      name="twitter:description"
      content="Carreras, moto, galería y patrocinadores de Joaquín González."
    />
    <meta name="twitter:image" content="https://joaquingonzalez10.netlify.app/og-image.jpg" />

    <!-- Precarga del logo del preloader: se descarga en paralelo al JS, sin esperar a React -->
    <link rel="preload" as="image" href="/logo-620.webp" type="image/webp" fetchpriority="high">

    <!-- ── Datos estructurados (JSON-LD) ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Joaquín González",
        "alternateName": "J10",
        "jobTitle": "Piloto de motocross",
        "description": "Piloto de motocross. Aquí no se frena: se acelera.",
        "url": "https://joaquingonzalez10.netlify.app/",
        "image": "https://joaquingonzalez10.netlify.app/og-image.jpg",
        "sameAs": [
          "https://www.instagram.com/TU_USUARIO",
          "https://www.facebook.com/TU_PAGINA",
          "https://www.youtube.com/@TU_CANAL"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="preloader">
      <div class="pl-inner">
        <div class="pl-logo-wrap">
          <div class="pl-hit">
            <img class="pl-logo" src="/logo-620.webp" width="620" height="371" alt="" fetchpriority="high">
          </div>
        </div>
      </div>
    </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
